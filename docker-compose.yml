services:
  web:
    build:
      context: .
      args:
        - HTTP_PROXY=http://host.docker.internal:7890
        - HTTPS_PROXY=http://host.docker.internal:7890
    ports:
      - "5100:8100"
    volumes:
      - investment-data:/root/.investment-assistant
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://right.codes/codex/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-7e4db148f1204e94bb8abeabef87c8ca}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    restart: unless-stopped

volumes:
  investment-data:
