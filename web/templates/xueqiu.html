{% extends "base.html" %}
{% block title %}雪球跟踪{% endblock %}
{% block content %}
<style>
  .post-card { transition: background 0.15s, border-color 0.15s; }
  .post-card:hover { background: #f9fafb; }
  .post-card.active { background: #eff6ff; border-left: 3px solid #3b82f6; }
  .post-card:not(.active) { border-left: 3px solid transparent; }
  .tag-original { background: #dbeafe; color: #1e40af; }
  .tag-retweet { background: #fef3c7; color: #92400e; }
  .tag-column  { background: #ede9fe; color: #5b21b6; }
  .filter-btn { transition: background 0.15s, color 0.15s; }
  .filter-btn.active { background: #1e40af; color: #fff; }
  .filter-btn:not(.active) { background: #f3f4f6; color: #6b7280; }
  .filter-btn:not(.active):hover { background: #e5e7eb; color: #374151; }
  .date-chip { transition: all 0.15s; cursor: pointer; }
  .date-chip:hover { background: #dbeafe; color: #1e40af; }
  .date-chip.active { background: #1e40af; color: #fff; }
  .post-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 8px 0; }
  .post-content a { color: #2563eb; text-decoration: underline; }
  .post-content blockquote { border-left: 3px solid #d1d5db; padding-left: 12px; margin: 12px 0; color: #6b7280; }
  .post-content p { margin: 0.5em 0; }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .page-btn { min-width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; }
  .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>

<div x-data="xueqiuApp()" x-init="init()">
  <!-- 顶部 -->
  <div class="flex justify-between items-center mb-4">
    <div class="flex items-center gap-3">
      <h1 class="text-2xl font-bold text-gray-900">雪球跟踪</h1>
      <div class="flex items-center gap-1.5">
        <select x-model="selectedUserId" @change="resetAndLoad()"
                class="px-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-400">
          <option value="">全部用户</option>
          <template x-for="u in users" :key="u.user_id">
            <option :value="u.user_id" x-text="u.nickname + ' (' + u.user_id + ')'"></option>
          </template>
        </select>
        <button @click="showAddUser = true"
                class="w-7 h-7 flex items-center justify-center rounded-md border border-gray-200 text-gray-500 hover:bg-gray-100 text-sm">+</button>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div class="relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="text" x-model="query" @input="onSearch()" placeholder="搜索帖子..."
               class="pl-9 pr-3 py-2 border border-gray-200 rounded-lg text-sm w-56 focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-100">
      </div>
      <div class="relative">
        <button @click="showSyncPanel = !showSyncPanel" :disabled="syncing"
                class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-lg text-sm disabled:opacity-50 transition-colors whitespace-nowrap">
          <span x-show="!syncing" x-text="!syncCursor ? '开始同步 ▾' : syncCursor.history_done ? '更新数据 ▾' : '继续同步 ▾'"></span>
          <span x-show="syncing" x-text="syncProgress || '同步中...'"></span>
        </button>
        <div x-show="showSyncPanel && !syncing" @click.away="showSyncPanel = false"
             class="absolute right-0 top-full mt-1 bg-white border border-gray-200 rounded-lg shadow-lg p-3 z-10 w-48">
          <label class="block text-xs text-gray-500 mb-1">爬取页数</label>
          <input type="number" x-model.number="maxPages" min="1" max="200"
                 class="w-full px-2 py-1 border border-gray-200 rounded-md text-sm mb-2 focus:outline-none focus:border-blue-400">
          <button @click="showSyncPanel = false; startSync()"
                  class="w-full bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-md text-sm">
            开始同步
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 添加用户弹窗 -->
  <div x-show="showAddUser" class="fixed inset-0 bg-black/30 flex items-center justify-center z-50" @click.self="showAddUser = false">
    <div class="bg-white rounded-xl p-5 w-80 shadow-xl">
      <h3 class="text-lg font-semibold mb-3">添加雪球用户</h3>
      <div class="space-y-3">
        <div>
          <label class="block text-xs text-gray-500 mb-1">用户 ID</label>
          <input type="number" x-model="newUserId" placeholder="如 1936609590"
                 class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-400">
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">昵称</label>
          <input type="text" x-model="newNickname" placeholder="如 逸修1"
                 class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-400">
        </div>
        <div class="flex gap-2">
          <button @click="showAddUser = false" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-50">取消</button>
          <button @click="addUser()" class="flex-1 px-3 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700">添加</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 同步进度条 -->
  <div x-show="syncing" class="mb-3 bg-blue-50 border border-blue-200 rounded-lg px-4 py-2 flex items-center gap-3">
    <div class="animate-spin w-4 h-4 border-2 border-blue-600 border-t-transparent rounded-full"></div>
    <span class="text-sm text-blue-700" x-text="syncProgress || '同步中...'"></span>
  </div>

  <!-- 主面板 -->
  <div class="bg-white rounded-xl border border-gray-200 overflow-hidden flex" style="height: calc(100vh - 180px);">

    <!-- 左侧列表 -->
    <div class="w-[35%] flex flex-col border-r border-gray-200 min-w-0">

      <!-- 筛选栏 -->
      <div class="p-3 border-b border-gray-200 space-y-2 flex-shrink-0">
        <!-- 类型筛选 -->
        <div class="flex gap-1.5">
          <template x-for="f in [{key:'all',label:'全部'},{key:'original',label:'原创'},{key:'retweet',label:'转发'},{key:'column',label:'长文'}]" :key="f.key">
            <button @click="setFilter(f.key)"
                    :class="filter === f.key ? 'active' : ''"
                    class="filter-btn px-3 py-1 rounded-md text-xs font-medium"
                    x-text="f.label"></button>
          </template>
        </div>
        <!-- 年份快捷 -->
        <div class="flex gap-1 flex-wrap">
          <template x-for="y in availableYears" :key="y">
            <button @click="setYear(y)"
                    :class="activeYear === y ? 'active' : ''"
                    class="date-chip px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-500"
                    x-text="y"></button>
          </template>
          <button x-show="activeYear" @click="clearDateFilter()"
                  class="date-chip px-2 py-0.5 rounded text-xs font-medium bg-red-50 text-red-400 hover:bg-red-100">清除</button>
        </div>
        <!-- 月份快捷 -->
        <div x-show="activeYear" class="flex gap-1 flex-wrap">
          <template x-for="m in 12" :key="m">
            <button @click="setMonth(m)"
                    :class="activeMonth === m ? 'active' : ''"
                    class="date-chip px-1.5 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-500"
                    x-text="m + '月'"></button>
          </template>
        </div>
      </div>

      <!-- 帖子列表 -->
      <div class="flex-1 overflow-y-auto">
        <div x-show="loading && posts.length === 0" class="text-center py-16 text-gray-400 text-sm">加载中...</div>
        <div x-show="!loading && posts.length === 0" class="text-center py-16 px-4">
          <p class="text-gray-400 text-sm">暂无数据</p>
          <p class="text-gray-300 text-xs mt-1">点击「同步数据」开始</p>
        </div>

        <template x-for="p in posts" :key="p.id">
          <div @click="selectPost(p.id)"
               :class="selectedId === p.id ? 'active' : ''"
               class="post-card px-3 py-3 border-b border-gray-100 cursor-pointer">
            <div class="flex items-center gap-2 mb-1.5">
              <span class="text-xs text-gray-400 font-mono" x-text="formatDate(p.created_at)"></span>
              <span class="text-xs px-1.5 py-0.5 rounded font-medium"
                    :class="typeLabel(p) === '长文' ? 'tag-column' : typeLabel(p) === '转发' ? 'tag-retweet' : 'tag-original'"
                    x-text="typeLabel(p)"></span>
            </div>
            <template x-if="p.is_column && p.title">
              <div class="text-sm font-medium text-gray-800 line-clamp-2 mb-1" x-text="p.title"></div>
            </template>
            <div class="text-xs text-gray-600 line-clamp-3 leading-relaxed"
                 x-text="stripHtml(p.description || p.text || '')"></div>
            <template x-if="p.retweet_status_id && p.retweet_description">
              <div class="mt-1.5 pl-2 border-l-2 border-gray-200 text-xs text-gray-400 line-clamp-2 leading-relaxed"
                   x-text="'转发: ' + stripHtml(p.retweet_description)"></div>
            </template>
          </div>
        </template>
      </div>

      <!-- 分页 -->
      <div x-show="totalPages > 1" class="px-3 py-2 border-t border-gray-100 flex-shrink-0 flex items-center justify-between">
        <span class="text-xs text-gray-400" x-text="'共 ' + total + ' 条'"></span>
        <div class="flex items-center gap-1">
          <button @click="goPage(page - 1)" :disabled="page <= 1"
                  class="page-btn rounded border border-gray-200 text-xs text-gray-500 hover:bg-gray-50">‹</button>
          <template x-for="(item, idx) in pageItems" :key="idx">
            <div>
              <span x-show="item.type === 'ellipsis'" class="text-xs text-gray-400 px-1">…</span>
              <button x-show="item.type === 'page'"
                      @click="goPage(item.num)" :disabled="item.num === page"
                      :class="item.num === page ? 'bg-blue-600 text-white border-blue-600' : 'border-gray-200 text-gray-600 hover:bg-gray-50'"
                      class="page-btn rounded border text-xs" x-text="item.num"></button>
            </div>
          </template>
          <button @click="goPage(page + 1)" :disabled="page >= totalPages"
                  class="page-btn rounded border border-gray-200 text-xs text-gray-500 hover:bg-gray-50">›</button>
        </div>
      </div>

      <!-- 同步状态 -->
      <div x-show="lastSyncTime || syncCursor" class="px-3 py-2 border-t border-gray-100 flex-shrink-0">
        <div class="flex items-center gap-2 text-xs text-gray-400 flex-wrap">
          <span x-show="syncCursor" x-text="'已同步 ' + (syncCursor?.total_posts || 0) + ' 条'"></span>
          <span x-show="syncCursor && syncCursor.history_done" class="text-green-500">历史已全部同步</span>
          <span x-show="syncCursor && !syncCursor.history_done" class="text-amber-500">历史同步中</span>
          <span x-show="lastSyncTime" x-text="'上次: ' + lastSyncTime"></span>
        </div>
      </div>
    </div>

    <!-- 右侧详情 -->
    <div class="w-[65%] overflow-y-auto min-w-0 reading-area">
      <div x-show="!selectedPost" class="flex items-center justify-center h-full text-gray-400 text-sm">
        选择一篇帖子开始阅读
      </div>

      <div x-show="selectedPost" class="p-6 max-w-3xl">
        <!-- 标题 -->
        <template x-if="selectedPost?.title">
          <h2 class="text-xl font-bold text-gray-900 mb-3 leading-snug" x-text="selectedPost.title"></h2>
        </template>

        <!-- 元信息 -->
        <div class="flex items-center gap-4 text-xs text-gray-400 mb-5 pb-4 border-b border-gray-100">
          <span x-text="selectedPost?.created_at ? new Date(selectedPost.created_at).toLocaleString('zh-CN') : ''"></span>
          <span x-show="selectedPost?.like_count > 0" x-text="'👍 ' + (selectedPost?.like_count || 0)"></span>
          <span x-show="selectedPost?.reply_count > 0" x-text="'💬 ' + (selectedPost?.reply_count || 0)"></span>
          <span x-show="selectedPost?.retweet_count > 0" x-text="'🔁 ' + (selectedPost?.retweet_count || 0)"></span>
          <span x-show="selectedPost?.view_count > 0" x-text="'👁 ' + (selectedPost?.view_count || 0)"></span>
        </div>

        <!-- 转发原文 -->
        <template x-if="selectedPost?.retweet_text">
          <div class="mb-5 bg-gray-50 border-l-4 border-gray-300 rounded-r-lg p-4">
            <div class="text-xs text-gray-400 mb-2 font-medium">转发内容</div>
            <div class="text-sm text-gray-600 leading-relaxed post-content" x-html="processHtml(selectedPost.retweet_text)"></div>
          </div>
        </template>

        <!-- 正文 -->
        <div class="text-[15px] text-gray-800 leading-[1.8] post-content" x-html="processHtml(selectedPost?.text || selectedPost?.description || '')"></div>

        <!-- 图片 -->
        <template x-if="selectedPost?.images && selectedPost.images.length > 0">
          <div class="mt-5 grid grid-cols-2 gap-3">
            <template x-for="img in selectedPost.images" :key="img">
              <img :src="'/api/xueqiu/images/' + selectedPost.id + '/' + img"
                   :onerror="'this.style.display=\'none\''"
                   class="rounded-lg border border-gray-100 w-full object-cover"
                   loading="lazy">
            </template>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>

<script>
function xueqiuApp() {
  return {
    posts: [],
    selectedId: null,
    selectedPost: null,
    filter: 'all',
    query: '',
    startDate: '',
    endDate: '',
    page: 1,
    perPage: 30,
    total: 0,
    loading: false,
    syncing: false,
    syncProgress: '',
    lastSyncTime: '',
    debounceTimer: null,
    users: [],
    selectedUserId: '',
    showAddUser: false,
    newUserId: '',
    newNickname: '',
    maxPages: 5,
    showSyncPanel: false,
    syncCursor: null,
    activeYear: null,
    activeMonth: null,

    get availableYears() {
      const now = new Date().getFullYear();
      const years = [];
      for (let y = now; y >= now - 4; y--) years.push(y);
      return years;
    },

    get totalPages() {
      return Math.ceil(this.total / this.perPage) || 1;
    },

    get pageItems() {
      const tp = this.totalPages;
      const p = this.page;
      const items = [];
      if (tp <= 7) {
        for (let i = 1; i <= tp; i++) items.push({type: 'page', num: i});
        return items;
      }
      items.push({type: 'page', num: 1});
      if (p > 3) items.push({type: 'ellipsis'});
      for (let i = Math.max(2, p - 1); i <= Math.min(tp - 1, p + 1); i++) {
        items.push({type: 'page', num: i});
      }
      if (p < tp - 2) items.push({type: 'ellipsis'});
      items.push({type: 'page', num: tp});
      return items;
    },

    setYear(y) {
      if (this.activeYear === y) { this.clearDateFilter(); return; }
      this.activeYear = y;
      this.activeMonth = null;
      this.startDate = `${y}-01-01`;
      this.endDate = `${y}-12-31`;
      this.resetAndLoad();
    },

    setMonth(m) {
      if (this.activeMonth === m) { this.activeMonth = null; this.setYear(this.activeYear); return; }
      this.activeMonth = m;
      const y = this.activeYear;
      const mm = String(m).padStart(2, '0');
      this.startDate = `${y}-${mm}-01`;
      const lastDay = new Date(y, m, 0).getDate();
      this.endDate = `${y}-${mm}-${String(lastDay).padStart(2, '0')}`;
      this.resetAndLoad();
    },

    clearDateFilter() {
      this.activeYear = null;
      this.activeMonth = null;
      this.startDate = '';
      this.endDate = '';
      this.resetAndLoad();
    },

    goPage(pg) {
      if (pg < 1 || pg > this.totalPages || pg === this.page) return;
      this.page = pg;
      this.loadPosts(false);
    },

    async loadUsers() {
      try {
        const resp = await fetch('/api/xueqiu/users');
        const data = await resp.json();
        this.users = data.users || [];
      } catch (e) { console.error('Failed to load users:', e); }
    },

    async addUser() {
      const uid = parseInt(this.newUserId);
      if (!uid || !this.newNickname.trim()) return;
      try {
        const resp = await fetch('/api/xueqiu/users', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({user_id: uid, nickname: this.newNickname.trim()})
        });
        if (!resp.ok) {
          const data = await resp.json().catch(() => ({}));
          alert(data.error || '添加失败');
          return;
        }
        this.showAddUser = false;
        this.newUserId = '';
        this.newNickname = '';
        await this.loadUsers();
        this.selectedUserId = uid;
        this.resetAndLoad();
      } catch (e) { console.error('Failed to add user:', e); }
    },

    async init() {
      await this.loadUsers();
      await this.loadPosts(false);
      this.fetchSyncStatus();
      const hash = window.location.hash;
      if (hash && hash.startsWith('#post-')) {
        const id = parseInt(hash.slice(6));
        if (id) this.selectPost(id);
      }
      document.querySelector('.reading-area')?.addEventListener('error', (e) => {
        if (e.target.tagName === 'IMG' && e.target.dataset.fallback) {
          e.target.src = e.target.dataset.fallback;
          delete e.target.dataset.fallback;
        }
      }, true);
    },

    async loadPosts(append) {
      this.loading = true;
      const params = new URLSearchParams({
        page: this.page,
        per_page: this.perPage,
        type: this.filter,
      });
      if (this.selectedUserId) params.set('user_id', parseInt(this.selectedUserId));
      if (this.query) params.set('q', this.query);
      if (this.startDate) params.set('start_date', this.startDate);
      if (this.endDate) params.set('end_date', this.endDate);

      try {
        const resp = await fetch('/api/xueqiu/posts?' + params.toString());
        const data = await resp.json();
        this.posts = data.posts || [];
        this.total = data.total || 0;
      } catch (e) {
        console.error('Failed to load posts:', e);
      }
      this.loading = false;
    },

    async selectPost(id) {
      this.selectedId = id;
      window.location.hash = 'post-' + id;
      try {
        const resp = await fetch('/api/xueqiu/posts/' + id);
        this.selectedPost = await resp.json();
      } catch (e) {
        console.error('Failed to load post:', e);
      }
    },

    onSearch() {
      clearTimeout(this.debounceTimer);
      this.debounceTimer = setTimeout(() => { this.resetAndLoad(); }, 300);
    },

    setFilter(f) {
      this.filter = f;
      this.resetAndLoad();
    },

    resetAndLoad() {
      this.page = 1;
      this.loadPosts(false);
      this.fetchSyncStatus();
    },

    async startSync(force = false) {
      if (!this.selectedUserId) {
        alert('请先选择要同步的用户');
        return;
      }
      this.syncing = true;
      this.syncProgress = '同步中...';
      try {
        const resp = await fetch('/api/xueqiu/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            force,
            user_id: this.selectedUserId ? parseInt(this.selectedUserId) : undefined,
            max_pages: this.maxPages
          }),
        });
        if (resp.status === 409) {
          if (confirm('上次同步未正常结束，是否强制重新同步？')) {
            return this.startSync(true);
          }
          this.syncing = false;
          this.syncProgress = '';
          return;
        }
        if (!resp.ok) {
          const data = await resp.json().catch(() => ({}));
          alert(data.error || `同步请求失败 (${resp.status})`);
          this.syncing = false;
          this.syncProgress = '';
          return;
        }
        this.pollSyncStatus();
      } catch (e) {
        console.error('Sync failed:', e);
        this.syncing = false;
        this.syncProgress = '';
      }
    },

    pollSyncStatus() {
      const poll = setInterval(async () => {
        try {
          const params = this.selectedUserId ? `?user_id=${this.selectedUserId}` : '';
          const resp = await fetch('/api/xueqiu/sync/status' + params);
          const data = await resp.json();
          if (data.status === 'syncing' || data.status === 'logging_in') {
            this.syncProgress = data.progress || ('已同步 ' + (data.count || 0) + ' 条');
          } else {
            clearInterval(poll);
            this.syncing = false;
            if (data.status === 'error') {
              this.syncProgress = '';
              alert('同步失败: ' + (data.progress || '未知错误'));
            } else {
              this.syncProgress = '';
              if (data.last_sync_time) {
                const d = new Date(parseInt(data.last_sync_time) * 1000);
                this.lastSyncTime = d.toLocaleString('zh-CN');
              }
              this.syncCursor = data.cursor;
              this.resetAndLoad();
            }
          }
        } catch (e) {
          clearInterval(poll);
          this.syncing = false;
          this.syncProgress = '';
        }
      }, 2000);
    },

    async fetchSyncStatus() {
      try {
        const params = this.selectedUserId ? `?user_id=${this.selectedUserId}` : '';
        const resp = await fetch('/api/xueqiu/sync/status' + params);
        const data = await resp.json();
        if (data.last_sync_time) {
          const d = new Date(parseInt(data.last_sync_time) * 1000);
          this.lastSyncTime = d.toLocaleString('zh-CN');
        }
        this.syncCursor = data.cursor;
      } catch (e) { /* ignore */ }
    },

    processHtml(html) {
      if (!html) return '';
      let cleaned = DOMPurify.sanitize(html, {
        ALLOWED_TAGS: ['p','br','div','span','img','a','b','strong','i','em','u','h1','h2','h3','h4','h5','h6','ul','ol','li','table','tr','td','th','thead','tbody','blockquote','pre','code','hr'],
        ALLOWED_ATTR: ['src','href','class','style','alt','title','width','height']
      });
      const postId = this.selectedPost?.id;
      if (!postId) return cleaned;
      const imageMap = this.selectedPost?.image_map || {};
      return cleaned.replace(/<img([^>]*)\ssrc=["']([^"']+)["']/g, (match, attrs, src) => {
        const origFilename = src.split('/').pop().split('?')[0];
        const localFilename = imageMap[origFilename];
        if (localFilename) {
          const localSrc = '/api/xueqiu/images/' + postId + '/' + localFilename;
          return '<img' + attrs + ' src="' + localSrc + '" data-fallback="' + encodeURI(src) + '"';
        }
        return match;
      });
    },

    formatDate(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    },

    typeLabel(p) {
      if (p.is_column) return '长文';
      if (p.retweet_status_id) return '转发';
      return '原创';
    },

    stripHtml(html) {
      if (!html) return '';
      return html.replace(/<[^>]*>/g, '').substring(0, 300);
    },
  };
}
</script>
{% endblock %}
