[project]
name = "investment-assistant"
version = "0.1.0"
description = "投资研究智能助手"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "flask>=3.0.0",
    "tavily-python>=0.5.0",
    "requests>=2.31.0",
    "yfinance>=0.2.0",
    "akshare>=1.10.0",
    "scrapling[fetchers]>=0.3.0",
    "httpx[socks]>=0.28.1",
    "markdownify>=0.13.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
investment-assistant = "assistant:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "web", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
